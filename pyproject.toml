[project]
name = "vimeotranscriber"
version = "0.1.0"
description = "Fetch transcripts for Vimeo videos: uses official captions when available, falls back to Whisper speech-to-text otherwise."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.4.9",
    "openai>=1.14",
]

[project.scripts]
vimeo-transcriber = "vimeotranscriber.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vimeotranscriber*"]
